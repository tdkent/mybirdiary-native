# RUN ON:
# - PR opened or synchronized.
# - Manual activation.

# JOBS:
# - Run linter and tests

name: Test

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - ".github/workflows/*"
      - ".husky/**"
      - ".vscode/**"
      - "assets/**"
      - "README.md"
      - ".gitignore"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: "~/.npm"
          key: deps-node-module-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run biome check
        run: npm run check

      - name: Run tests
        run: npm run test
