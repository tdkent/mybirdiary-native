# RUN ON:
# - PR opened or synchronized.
# - Manual activation.

# JOBS:
# - Lint, type check, run tests

name: Test

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths-ignore:
      - ".husky/**"
      - "assets/**"
      - "README.md"
      - ".gitignore"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run biome check
        run: npm run check

      # Generate gitignored type files required to pass type check
      - name: Generate type declarations
        run: npm run typegen

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test
