# RUN ON:
# - PR opened or synchronized.
# - Manual activation.

# JOBS:
# - Run all tests

name: Test

on:
  workflow_run:
    workflows: ["Check"]
    types:
      - completed

  workflow_dispatch:

jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read

    steps:
      - name: Get code
        uses: actions/checkout@v7

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: "~/.npm"
          key: deps-node-module-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run Biome check
        run: npm run test

  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo 'Test workflow did not run because Lint workflow failed'
